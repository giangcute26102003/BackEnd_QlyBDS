name: Deploy Spring Boot with Docker

on:
  push:
    branches: [ "test-deploy" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: backend-qlybds

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Docker is available
        run: |
          docker --version
          docker ps
          echo "✓ Docker is available on runner"

      - name: Set image name and tag
        id: image
        run: |
          # Convert repository name to lowercase for Docker compatibility
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ env.REGISTRY }}/${REPO_LOWER}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${REPO_LOWER}:latest"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "latest=${IMAGE_LATEST}" >> $GITHUB_OUTPUT
          echo "Using image: ${IMAGE_TAG}"
          echo "Latest tag: ${IMAGE_LATEST}"

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.image.outputs.tag }} -t ${{ steps.image.outputs.latest }} .
          echo "✓ Docker image built successfully"

      - name: Remove old container and cleanup
        run: |
          CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
          if docker ps -a --format='{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            echo "Stopping container: $CONTAINER_NAME"
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
          fi
          # Optional: prune dangling images
          docker image prune -f || true
          echo "✓ Old container removed"

      - name: Start new container
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            -p 8080:8080 \
            --restart unless-stopped \
            --log-driver json-file \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            -e SPRING_DATASOURCE_URL="${{ secrets.DB_URL }}" \
            -e SPRING_DATASOURCE_USERNAME="${{ secrets.DB_USERNAME }}" \
            -e SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e ENCRYPTION_MASTER_KEY_BASE64="${{ secrets.ENCRYPTION_MASTER_KEY }}" \
            -e ENCRYPTION_HASH_KEY_BASE64="${{ secrets.ENCRYPTION_HASH_KEY }}" \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_REGION="${{ secrets.AWS_REGION }}" \
            -e AWS_S3_BUCKET_NAME="${{ secrets.AWS_S3_BUCKET_NAME }}" \
            ${{ steps.image.outputs.tag }}
          echo "✓ New container started"

      - name: Verify container is running
        run: |
          sleep 5
          if docker ps --format='{{.Names}}' | grep -q "^${{ env.CONTAINER_NAME }}$"; then
            echo "✓ Container is running"
            docker ps --filter name=${{ env.CONTAINER_NAME }}
          else
            echo "✗ Container failed to start"
            docker logs ${{ env.CONTAINER_NAME }}
            exit 1
          fi

      - name: Push to registry (optional)
        # Uncomment and configure secrets to enable pushing to GHCR/Docker Hub
        # run: |
        #   echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
        #   docker push ${{ steps.image.outputs.tag }}
        #   docker push ${{ steps.image.outputs.latest }}
        run: |
          echo "Container deployment complete. Pushing to registry can be enabled in workflow."
